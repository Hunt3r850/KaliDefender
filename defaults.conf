#!/bin/bash
# KaliDefender v6.0.0 - Configuración por Defecto
# Personaliza estas variables según tus necesidades

# Puertos para modo Attack
export KALIDEFENDER_TCP_PORTS="22,80,443,4444,5555,8080"
export KALIDEFENDER_UDP_PORTS="53,1194"

# Configuración Fail2Ban
export KALIDEFENDER_BANTIME="24h"
export KALIDEFENDER_MAXRETRY="3"

# Dashboard
export KALIDEFENDER_DASHBOARD_PORT="8443"
# export KALIDEFENDER_AUTH_TOKEN="tu-token-seguro-aqui"

# Directorios
export KALIDEFENDER_BASE_DIR="/etc/kalidefender"
export KALIDEFENDER_LOG_FILE="/var/log/kalidefender.log"
export KALIDEFENDER_LOG_FORMAT="json"  # o "plain"